name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish to pub.dev
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: pub.dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure pub.dev OIDC authentication
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1

      - name: Install latest stable Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Require tag and package versions to match
        shell: bash
        run: |
          package_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Verify source cleanliness
        run: |
          dart fix --apply
          dart format .
          git diff --exit-code

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart run melos run test

      - name: Run benchmark smoke test
        run: dart run melos run benchmark:smoke

      - name: Validate API documentation
        run: dart doc --validate-links

      - name: Check whether this version is already published
        id: publication
        shell: bash
        run: |
          package_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          response_path="${RUNNER_TEMP}/pub-version.json"
          status_code="$(curl --silent --show-error \
            --output "${response_path}" \
            --write-out '%{http_code}' \
            "https://pub.dev/api/packages/seeko/versions/${package_version}")"
          case "${status_code}" in
            200) echo "exists=true" >> "${GITHUB_OUTPUT}" ;;
            404) echo "exists=false" >> "${GITHUB_OUTPUT}" ;;
            *)
              cat "${response_path}"
              echo "Unexpected pub.dev response: ${status_code}" >&2
              exit 1
              ;;
          esac

      - name: Audit publish archive
        if: steps.publication.outputs.exists != 'true'
        run: dart pub publish --dry-run

      - name: Publish with pub.dev trusted publishing
        if: steps.publication.outputs.exists != 'true'
        run: dart pub publish --force

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes
